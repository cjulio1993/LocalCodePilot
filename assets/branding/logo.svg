<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">LocalCodePilot</title>
  <desc id="desc">LocalCodePilot logo: a project core surrounded by three modular paths.</desc>
  <style>
    .wordmark { fill: #111827; }
    .core { fill: #111827; stroke: #F8FAFC; stroke-width: 5; }
