[workspace]
resolver = "3"
members = ["core", "platform", "runtime", "services", "cli", "desktop"]
default-members = ["desktop"]

[workspace.package]
version = "0.4.0-alpha.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
localcodepilot-core = { path = "core" }
localcodepilot-platform = { path = "platform" }
localcodepilot-runtime = { path = "runtime" }
localcodepilot-services = { path = "services" }
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "links", "wayland", "x11"] }
rfd = "0.17.2"
sysinfo = "0.39.6"
egui-phosphor = "0.14"
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
semver = "1"
toml = "1"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
