[package]
name = "localcodepilot-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
localcodepilot-core.workspace = true
localcodepilot-platform.workspace = true
serde_json.workspace = true
toml.workspace = true
semver.workspace = true
serde_yaml_ng.workspace = true
rusqlite = { version = "0.43", features = ["bundled"] }
serde.workspace = true
sha2.workspace = true
ureq.workspace = true
zip.workspace = true
ring.workspace = true
# Administrator connections to the servers the app manages (127.0.0.1 only).
tokio = { version = "1.54", features = ["rt", "net", "time"] }
tokio-postgres = "0.7.18"
mysql_async = { version = "0.37.1", default-features = false, features = ["default-rustls-ring"] }
# SQL Server (TDS) for the connection test and the container the app manages.
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
# tiberius turns on rustls' aws-lc-rs next to the ring that mysql_async uses; with two
# backends rustls has no default and mysql_async's TLS panics. `tls_ready` picks ring.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
