[package]
name = "localcodepilot-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "localcodepilot-desktop"
path = "src/main.rs"

[features]
default = []
# Local update feed for end-to-end tests between two builds (see
# scripts/e2e-update-windows.ps1). Refused in release builds; never enable it
# when packaging.
update-test-feed = []

[dependencies]
eframe.workspace = true
egui-phosphor.workspace = true
rfd.workspace = true
localcodepilot-core.workspace = true
localcodepilot-platform.workspace = true
localcodepilot-runtime.workspace = true
serde_json.workspace = true
serde.workspace = true
semver.workspace = true
ureq.workspace = true
sha2.workspace = true
ring.workspace = true
sysinfo.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[build-dependencies]
embed-resource = "3.0"
