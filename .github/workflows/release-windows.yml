name: Release Windows alpha

on:
  push:
    tags:
      - "v*-alpha.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build and publish Windows x64
    runs-on: windows-2022
    env:
      ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Validate tag and Cargo version
        shell: pwsh
        run: |
          $cargoVersion = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq "localcodepilot-desktop" } |
            Select-Object -ExpandProperty version
          if ($cargoVersion -ne "${{ steps.version.outputs.value }}") {
            throw "A tag contém ${{ steps.version.outputs.value }}, mas Cargo.toml contém $cargoVersion."
          }

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Build release executable
        run: cargo build --release --locked -p localcodepilot-desktop

      - name: Sign executable with Microsoft Artifact Signing
        if: env.ARTIFACT_SIGNING_ENDPOINT != '' && env.ARTIFACT_SIGNING_ACCOUNT != '' && env.ARTIFACT_SIGNING_PROFILE != '' && env.AZURE_TENANT_ID != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_CLIENT_SECRET != ''
        uses: Azure/artifact-signing-action@v1
        with:
          azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ env.AZURE_CLIENT_SECRET }}
          endpoint: ${{ env.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\target\release\localcodepilot-desktop.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: LocalCodePilot
          description-url: https://localcodepilot.com.br/

      - name: Verify signed executable
        if: env.ARTIFACT_SIGNING_ENDPOINT != '' && env.ARTIFACT_SIGNING_ACCOUNT != '' && env.ARTIFACT_SIGNING_PROFILE != '' && env.AZURE_TENANT_ID != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_CLIENT_SECRET != ''
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath target\release\localcodepilot-desktop.exe
          if ($signature.Status -ne "Valid") {
            throw "A assinatura Authenticode não é válida: $($signature.StatusMessage)"
          }
          Write-Host "Assinado por $($signature.SignerCertificate.Subject)"

      - name: Record unsigned build notice
        if: env.ARTIFACT_SIGNING_ENDPOINT == '' || env.ARTIFACT_SIGNING_ACCOUNT == '' || env.ARTIFACT_SIGNING_PROFILE == '' || env.AZURE_TENANT_ID == '' || env.AZURE_CLIENT_ID == '' || env.AZURE_CLIENT_SECRET == ''
        shell: pwsh
        run: |
          "### Assinatura digital" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "O executável foi publicado sem Authenticode porque o Artifact Signing ainda não foi configurado." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Package portable application
        shell: pwsh
        run: .\scripts\package-windows.ps1 -Version "${{ steps.version.outputs.value }}" -SkipBuild

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalCodePilot-${{ steps.version.outputs.value }}-windows-x64
          path: |
            dist/LocalCodePilot-${{ steps.version.outputs.value }}-windows-x64.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "${{ steps.version.outputs.value }}"
          $repository = "${{ github.repository }}"
          $archive = "dist\LocalCodePilot-$version-windows-x64.zip"
          $checksums = "dist\SHA256SUMS.txt"
          $notes = "docs\releases\v$version.md"

          if (gh release view $tag --repo $repository --json tagName 2>$null) {
            gh release edit $tag `
              --repo $repository `
              --prerelease `
              --title "LocalCodePilot $version" `
              --notes-file $notes
            gh release upload $tag $archive $checksums `
              --repo $repository `
              --clobber
          } else {
            gh release create $tag $archive $checksums `
              --repo $repository `
              --verify-tag `
              --prerelease `
              --title "LocalCodePilot $version" `
              --notes-file $notes
          }
