name: Release desktop alpha

on:
  push:
    tags:
      - "v*-alpha.*"

permissions:
  contents: write
  id-token: write

jobs:
  windows:
    name: Build Windows x64
    if: github.ref_name != 'v0.4.0-alpha.6-rc.1'
    runs-on: windows-2022
    env:
      ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Validate tag and Cargo version
        shell: pwsh
        run: |
          $cargoVersion = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq "localcodepilot-desktop" } |
            Select-Object -ExpandProperty version
          if ($cargoVersion -ne "${{ steps.version.outputs.value }}") {
            throw "A tag contém ${{ steps.version.outputs.value }}, mas Cargo.toml contém $cargoVersion."
          }

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Build release executable
        run: cargo build --release --locked -p localcodepilot-desktop

      - name: Sign executable with Microsoft Artifact Signing
        if: env.ARTIFACT_SIGNING_ENDPOINT != '' && env.ARTIFACT_SIGNING_ACCOUNT != '' && env.ARTIFACT_SIGNING_PROFILE != '' && env.AZURE_TENANT_ID != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_CLIENT_SECRET != ''
        uses: Azure/artifact-signing-action@v1
        with:
          azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ env.AZURE_CLIENT_SECRET }}
          endpoint: ${{ env.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\target\release\localcodepilot-desktop.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: LocalCodePilot
          description-url: https://localcodepilot.com.br/

      - name: Verify signed executable
        if: env.ARTIFACT_SIGNING_ENDPOINT != '' && env.ARTIFACT_SIGNING_ACCOUNT != '' && env.ARTIFACT_SIGNING_PROFILE != '' && env.AZURE_TENANT_ID != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_CLIENT_SECRET != ''
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath target\release\localcodepilot-desktop.exe
          if ($signature.Status -ne "Valid") {
            throw "A assinatura Authenticode não é válida: $($signature.StatusMessage)"
          }

      - name: Record unsigned build notice
        if: env.ARTIFACT_SIGNING_ENDPOINT == '' || env.ARTIFACT_SIGNING_ACCOUNT == '' || env.ARTIFACT_SIGNING_PROFILE == '' || env.AZURE_TENANT_ID == '' || env.AZURE_CLIENT_ID == '' || env.AZURE_CLIENT_SECRET == ''
        shell: pwsh
        run: |
          "### Assinatura digital" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "O executável foi criado sem Authenticode porque o Artifact Signing ainda não foi configurado." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Package portable application
        shell: pwsh
        run: .\scripts\package-windows.ps1 -Version "${{ steps.version.outputs.value }}" -SkipBuild

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            dist/LocalCodePilot-${{ steps.version.outputs.value }}-windows-x64.zip
            dist/LocalCodePilot-${{ steps.version.outputs.value }}-windows-x64.exe
            dist/SHA256SUMS.txt

  macos:
    name: Build macOS universal
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "localcodepilot-desktop") | .version')"
          if [[ "$cargo_version" != "$version" ]]; then
            echo "A tag contém $version, mas Cargo.toml contém $cargo_version." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Run tests on macOS
        run: cargo test --workspace --locked

      - name: Build Intel and Apple Silicon binaries
        run: |
          cargo build --release --locked -p localcodepilot-desktop --target x86_64-apple-darwin
          cargo build --release --locked -p localcodepilot-desktop --target aarch64-apple-darwin
          mkdir -p target/macos-universal
          lipo -create \
            target/x86_64-apple-darwin/release/localcodepilot-desktop \
            target/aarch64-apple-darwin/release/localcodepilot-desktop \
            -output target/macos-universal/localcodepilot-desktop
          lipo target/macos-universal/localcodepilot-desktop -verify_arch x86_64 arm64

      - name: Package and verify DMG
        run: bash scripts/package-macos.sh "${{ steps.version.outputs.value }}" target/macos-universal/localcodepilot-desktop

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: |
            dist/LocalCodePilot-${{ steps.version.outputs.value }}-macos-universal.dmg
            dist/SHA256SUMS-macos.txt

  publish:
    name: Publish GitHub prerelease
    needs: [windows, macos]
    if: >-
      always() && !cancelled() &&
      ((github.ref_name == 'v0.4.0-alpha.6-rc.1' &&
        needs.macos.result == 'success' && needs.windows.result == 'skipped') ||
       (github.ref_name != 'v0.4.0-alpha.6-rc.1' &&
        needs.windows.result == 'success' && needs.macos.result == 'success'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows assets
        if: needs.windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: dist/windows

      - name: Download macOS assets
        if: needs.macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: macos-release-assets
          path: dist/macos

      - name: Publish release after required platform succeeds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          notes="docs/releases/v$version.md"
          if [[ "$tag" == "v0.4.0-alpha.6-rc.1" ]]; then
            cp dist/macos/SHA256SUMS-macos.txt dist/SHA256SUMS.txt
            assets=(
              "dist/macos/LocalCodePilot-$version-macos-universal.dmg"
              "dist/SHA256SUMS.txt"
            )
          else
            cat dist/windows/SHA256SUMS.txt dist/macos/SHA256SUMS-macos.txt > dist/SHA256SUMS.txt
            assets=(
              "dist/windows/LocalCodePilot-$version-windows-x64.zip"
              "dist/windows/LocalCodePilot-$version-windows-x64.exe"
              "dist/macos/LocalCodePilot-$version-macos-universal.dmg"
              "dist/SHA256SUMS.txt"
            )
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --prerelease --title "LocalCodePilot $version" --notes-file "$notes"
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "LocalCodePilot $version" --notes-file "$notes"
          fi
