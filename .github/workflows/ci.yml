name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate container command flow
        working-directory: tests/fixtures/containers-smoke
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker compose --file compose.yaml down --volumes --remove-orphans; }
          trap cleanup EXIT
          docker compose --file compose.yaml config --quiet
          docker compose --file compose.yaml up --detach
          docker compose --file compose.yaml ps --all
          docker compose --file compose.yaml logs --tail 200 | grep "LocalCodePilot Docker QA OK"
          docker compose --file compose.yaml stop
          test -z "$(docker compose --file compose.yaml ps --status running --quiet)"
          docker build --file Dockerfile .

  podman-smoke:
    name: Podman Compose smoke test
    runs-on: ubuntu-latest
    env:
      PODMAN_COMPOSE_PROVIDER: podman-compose
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Podman Compose
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman podman-compose
      - name: Validate container command flow
        working-directory: tests/fixtures/containers-smoke
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { podman compose --file compose.yaml down --volumes; }
          trap cleanup EXIT
          podman info
          podman compose --file compose.yaml config
          podman compose --file compose.yaml up --detach
          podman compose --file compose.yaml ps
          podman compose --file compose.yaml logs --tail 200 | grep "LocalCodePilot Docker QA OK"
          podman compose --file compose.yaml stop
          podman build --file Dockerfile .

  quality:
    name: Formatting and Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Clippy with the local update test feed
        run: cargo clippy -p localcodepilot-desktop --all-targets --features update-test-feed -- -D warnings

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Run desktop tests with the local update test feed
        run: cargo test -p localcodepilot-desktop --locked --features update-test-feed
      - name: Check the version of the Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p localcodepilot-desktop --locked
          .\scripts\check-exe-version.ps1 -Exe target\debug\localcodepilot-desktop.exe
          # The check must fail on a mismatch: a wrong expected version is refused.
          & .\scripts\check-exe-version.ps1 -Exe target\debug\localcodepilot-desktop.exe -Expected 0.0.1-alpha.1
          if ($LASTEXITCODE -eq 0) { throw "check-exe-version.ps1 accepted a wrong version." }
          Write-Host "Mismatch detected as expected."
          $global:LASTEXITCODE = 0
      - name: Check the signing of the release checksums
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # A throwaway key: the release key exists only as a release secret.
          work="$(mktemp -d)"
          openssl genpkey -algorithm ed25519 -out "$work/key.pem"
          openssl pkey -in "$work/key.pem" -pubout -out "$work/key.pub.pem"
          printf 'abc  LocalCodePilot-9.9.9-windows-x64.exe\n' > "$work/SHA256SUMS.txt"
          UPDATE_SIGNING_KEY="$(cat "$work/key.pem")" bash scripts/sign-checksums.sh "$work/SHA256SUMS.txt" "$work/key.pub.pem"
          test "$(stat -c %s "$work/SHA256SUMS.txt.sig")" -eq 64
          # Without the secret, or with a key that is not the repository's, signing fails.
          if UPDATE_SIGNING_KEY="" bash scripts/sign-checksums.sh "$work/SHA256SUMS.txt" "$work/key.pub.pem"; then
            echo "::error::signed without UPDATE_SIGNING_KEY"; exit 1
          fi
          if UPDATE_SIGNING_KEY="$(cat "$work/key.pem")" bash scripts/sign-checksums.sh "$work/SHA256SUMS.txt" packaging/update-signing.pub.pem; then
            echo "::error::accepted a key that is not the repository's"; exit 1
          fi
          echo "Signing checks passed."

