name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate container command flow
        working-directory: tests/fixtures/containers-smoke
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker compose --file compose.yaml down --volumes --remove-orphans; }
          trap cleanup EXIT
          docker compose --file compose.yaml config --quiet
          docker compose --file compose.yaml up --detach
          docker compose --file compose.yaml ps --all
          docker compose --file compose.yaml logs --tail 200 | grep "LocalCodePilot Docker QA OK"
          docker compose --file compose.yaml stop
          test -z "$(docker compose --file compose.yaml ps --status running --quiet)"
          docker build --file Dockerfile .

  podman-smoke:
    name: Podman Compose smoke test
    runs-on: ubuntu-latest
    env:
      PODMAN_COMPOSE_PROVIDER: podman-compose
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Podman Compose
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman podman-compose
      - name: Validate container command flow
        working-directory: tests/fixtures/containers-smoke
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { podman compose --file compose.yaml down --volumes; }
          trap cleanup EXIT
          podman info
          podman compose --file compose.yaml config
          podman compose --file compose.yaml up --detach
          podman compose --file compose.yaml ps
          podman compose --file compose.yaml logs --tail 200 | grep "LocalCodePilot Docker QA OK"
          podman compose --file compose.yaml stop
          podman build --file Dockerfile .

  quality:
    name: Formatting and Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --locked

